name: PR Review Agent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
          TIGER_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
        run: python -m pytest -q

      - name: Build Docker image
        run: docker build -t pr-review-agent:${{ github.sha }} .